{% extends 'base.html' %}

{% block content %}
  <h2>编辑用户: {{ user.student_id }}</h2>
  <form action="{{ url_for('edit_user', user_id=user.id) }}" method="post">
    <div class="mb-3">
      <label for="student_id" class="form-label">学号</label>
      <input type="text" class="form-control" id="student_id" name="student_id" value="{{ user.student_id }}" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">邮箱</label>
      <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="plaintext_password" class="form-label">明文密码计算</label>
            <div class="input-group">
                <input type="text" class="form-control" id="plaintext_password" placeholder="在此输入明文">
                <button class="btn btn-secondary" type="button" onclick="calculateMd5()">计算MD5</button>
            </div>
        </div>
        <div class="col-md-6">
            <label for="password" class="form-label">新密码 (MD5)</label>
            <input type="text" class="form-control" id="password" name="password" placeholder="留空以保持当前密码">
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="reminder_threshold_1" class="form-label">提醒阈值1 (小时)</label>
            <input type="number" class="form-control" id="reminder_threshold_1" name="reminder_threshold_1" value="{{ user.reminder_threshold_1 }}">
        </div>
        <div class="col-md-6">
            <label for="reminder_threshold_2" class="form-label">提醒阈值2 (小时)</label>
            <input type="number" class="form-control" id="reminder_threshold_2" name="reminder_threshold_2" value="{{ user.reminder_threshold_2 }}">
        </div>
    </div>

    <button type="submit" class="btn btn-primary">保存更改</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">取消</a>
  </form>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
<script>
function calculateMd5() {
    var plaintext = document.getElementById('plaintext_password').value;
    if (plaintext) {
        var hash = md5(plaintext);
        document.getElementById('password').value = hash;
    }
}
</script>
{% endblock %}
