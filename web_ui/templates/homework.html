{% extends 'base.html' %}

{% block content %}
  <h2>{{ user.student_id }} 的作业列表</h2>
  <a href="{{ url_for('index') }}" class="btn btn-primary mb-3">返回用户列表</a>
  <table class="table">
    <thead>
      <tr>
        <th>课程</th>
        <th>标题</th>
        <th>截止时间</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody>
      {% for hw in user.homeworks %}
      <tr>
        <td>{{ hw.course_name }}</td>
        <td>{{ hw.title }}</td>
        <td>{{ hw.end_time.strftime('%Y-%m-%d %H:%M') }}</td>
        <td>{{ hw.status }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="4" class="text-center">该用户没有作业。</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
